# Package bundles for the TeX Live installer (mkbundles.sh, Install-Packages).
# name  base  packages...
#   base "-": the bundle is complete; "Minimal": it holds only what is not
#   in Minimal already (so it goes with any of Minimal, Paper, AllPackages)
Minimal      -        scheme-basic
Paper        -        scheme-basic collection-latexrecommended collection-latexextra collection-pictures collection-fontsrecommended collection-bibtexextra collection-mathscience
AllPackages  -        scheme-basic collection-langenglish collection-bibtexextra collection-binextra collection-fontsrecommended collection-fontutils collection-formatsextra collection-games collection-humanities collection-latexextra collection-latexrecommended collection-luatex collection-mathscience collection-metapost collection-music collection-pictures collection-plaingeneric collection-pstricks collection-publishers
European     Minimal  collection-langgerman collection-langfrench collection-langitalian collection-langspanish collection-langportuguese collection-langpolish collection-langczechslovak collection-langeuropean
Cyrillic     Minimal  collection-langcyrillic
Greek        Minimal  collection-langgreek
ArabicIndic  Minimal  collection-langarabic collection-langother
Chinese      Minimal  collection-langchinese
Japanese     Minimal  collection-langjapanese
Korean       Minimal  collection-langkorean
PopularFonts Minimal  newtx newtxtt libertinus libertinus-type1 libertinus-otf libertinus-fonts inconsolata sourcesanspro sourcecodepro sourceserifpro stix2-otf stix2-type1 ebgaramond kpfonts mlmodern iwona fontawesome
AllFonts     Minimal  collection-fontsextra
