

%%% FONTSPEC.CFG %%%
%
% This configuration file sets up TeX Ligatures by default for all fonts loaded
% with `\setmainfont` and `\setsansfont`.
%
% In addition, `\setmonofont` has default features to enforce "monospace"
% settings with regard to space stretchability and shrinkability.
%
% Make a copy of this file in your own home TEXMF directory to set up your own
% defaults.

\defaultfontfeatures
 [\rmfamily,\sffamily]
 {Ligatures=TeX}

\defaultfontfeatures
 [\ttfamily]
 {WordSpace={1,0,0},
  HyphenChar=None,
  PunctuationSpace=WordSpace}

% ---------------------------------------------------------------------
% AmigaOS (TeX Live for AmigaOS 3): use HarfBuzz to shape text by default.
% luaotfload's own shaper ("node" mode) needs several hundred MB to read
% a big font such as FreeSerif or Amiri for the first time; HarfBuzz
% needs a few MB.  A font can still ask for the other shaper with
% Renderer=Node.  This file is found before fontspec's own fontspec.cfg
% because it is in tex/lualatex/; the text above is that file unchanged.
\defaultfontfeatures{Renderer=HarfBuzz}
